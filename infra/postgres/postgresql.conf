# Server configuration of the postgres container (ADR 0008). Set explicitly, so that a changed default or
# image cannot turn statement logging on. Bind values carry secrets (code verifier, invite token, token hashes).

# Set explicitly: with config_file the image's default listen_addresses is not read. Access is limited by pg_hba
# and by the internal data network (ADR 0008).
listen_addresses = '*'
shared_buffers = 128MB
# Services use at most 5 connections each, plus the migration jobs and one reserved for admin.
max_connections = 20

log_statement = 'none'
log_min_duration_statement = -1
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_error_verbosity = terse

# Main configuration of edge (ADR 0009, amendments review 4 and 5). Replaces the image's nginx.conf,
# which logs $request and uses error_log at notice.
user nginx;
worker_processes auto;
error_log /dev/stderr emerg;

events {}

http {
    # The invite token is masked in logged paths. $uri has no query string.
    map $uri $log_path {
        default                                 $uri;
        ~^(/api/invites/|/invite/)[^/]+(.*)$    "$1:token$2";
    }

    log_format ol '$remote_addr $request_method $log_path $status $body_bytes_sent '
                  '$request_time $upstream_status $sent_http_x_request_id';
    access_log /dev/stdout ol;

    # Login endpoints: 10 requests per minute per client address, burst 5 (ADR 0009 amendment on rate limiting).
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    server_tokens off;
    client_max_body_size 1m;
    # Responses are never written to disk (ADR 0009 review 5).
    proxy_max_temp_file_size 0;

    include /etc/nginx/conf.d/*.conf;
}

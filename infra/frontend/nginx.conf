# Configuration of the frontend container (ADR 0008, amendment review 5). Replaces the image's nginx.conf,
# which logs $request and uses error_log at notice.
worker_processes auto;
# The default pid path is not writable for uid 101 (ADR 0008 operations base, item 11).
pid /tmp/nginx.pid;
error_log /dev/stderr emerg;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location = /healthz {
            return 200;
        }

        # Paths of the single-page app (for example /invite/<token>) fall back to index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

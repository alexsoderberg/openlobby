# Production stack (ADR 0008, ADR 0009). Local overrides: compose.dev.yaml. First certificate: compose.bootstrap.yaml.
# All environment differences come from infra/.env (see .env.example). Only edge publishes ports.
name: openlobby

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-go-service: &go-service
  <<: *common
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  deploy:
    resources:
      limits:
        memory: 64M

# Go does not read the container memory limit by default (ADR 0008 operations base, item 5).
x-go-memory: &go-memory
  GOMEMLIMIT: 48MiB

x-go-env: &go-env
  <<: *go-memory
  HTTP_ADDR: ":8080"

x-go-healthcheck: &go-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  edge:
    <<: *common
    image: nginx:1.31.2-alpine
    # The master runs as root to bind 80/443 and read the key; the workers run as nginx (ADR 0009, item 1).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 32M
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certs:/etc/letsencrypt:ro
      - acme-webroot:/var/www/acme:ro
    networks: [public, edge-gateway]
    depends_on:
      gateway:
        condition: service_healthy

  certbot:
    <<: *common
    image: certbot/certbot:v5.9.0
    # Renews every 12 hours; the bootstrap run uses --entrypoint certbot instead (infra/README.md).
    # Runs as root by design (ADR 0009, item 2), with no capabilities.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"]
    deploy:
      resources:
        limits:
          memory: 96M
    volumes:
      - certs:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    networks: [certbot-egress]

  gateway:
    <<: *go-service
    build: &build-gateway
      context: ..
      dockerfile: services/gateway/Dockerfile
    image: &image-gateway openlobby/gateway:${OPENLOBBY_VERSION:-dev}
    environment:
      <<: *go-env
      AUTH_URL: http://auth:8080
      CALENDAR_URL: http://calendar:8080
      FRONTEND_URL: http://frontend:8080
    healthcheck:
      <<: *go-healthcheck
      test: ["CMD", "/gateway", "healthcheck"]
    depends_on:
      auth:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [edge-gateway, gateway-frontend, services]

  frontend:
    <<: *common
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
    image: openlobby/frontend:${OPENLOBBY_VERSION:-dev}
    # uid 101 is the nginx user of the official image (ADR 0008 operations base, item 11).
    user: "101:101"
    # Nginx creates its temp directories under /var/cache/nginx at start, so uid 101 must own it. A tmpfs keeps the
    # container stateless (ADR 0008 operations base, item 11).
    tmpfs:
      - /var/cache/nginx:mode=0755,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [gateway-frontend]

  auth:
    <<: *go-service
    build: &build-auth
      context: ..
      dockerfile: services/auth/Dockerfile
    image: &image-auth openlobby/auth:${OPENLOBBY_VERSION:-dev}
    environment:
      <<: *go-env
      # shortcut: traffic between services and postgres is not encrypted, upgrade with server certificates if the database leaves the host
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD}@postgres:5432/auth?sslmode=disable
      DATABASE_MAX_CONNECTIONS: "5"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      SYSTEM_ADMINS: ${SYSTEM_ADMINS}
    healthcheck:
      <<: *go-healthcheck
      test: ["CMD", "/auth", "healthcheck"]
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    networks: [services, data, auth-egress]

  auth-migrate:
    <<: *go-service
    restart: "no"
    build: *build-auth
    image: *image-auth
    command: ["migrate", "up"]
    environment:
      <<: *go-memory
      DATABASE_URL: postgres://auth_migrate:${AUTH_MIGRATE_DB_PASSWORD}@postgres:5432/auth?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  calendar:
    <<: *go-service
    build: &build-calendar
      context: ..
      dockerfile: services/calendar/Dockerfile
    image: &image-calendar openlobby/calendar:${OPENLOBBY_VERSION:-dev}
    environment:
      <<: *go-env
      AUTH_URL: http://auth:8080
      # shortcut: traffic between services and postgres is not encrypted, upgrade with server certificates if the database leaves the host
      DATABASE_URL: postgres://calendar:${CALENDAR_DB_PASSWORD}@postgres:5432/calendar?sslmode=disable
      DATABASE_MAX_CONNECTIONS: "5"
    healthcheck:
      <<: *go-healthcheck
      test: ["CMD", "/calendar", "healthcheck"]
    depends_on:
      auth:
        condition: service_healthy
      calendar-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [services, data]

  calendar-migrate:
    <<: *go-service
    restart: "no"
    build: *build-calendar
    image: *image-calendar
    command: ["migrate", "up"]
    environment:
      <<: *go-memory
      DATABASE_URL: postgres://calendar_migrate:${CALENDAR_MIGRATE_DB_PASSWORD}@postgres:5432/calendar?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  postgres:
    <<: *common
    image: postgres:17
    # Set verified (fresh init and restart) on Docker 29.6.1. CHOWN is unnecessary only because the named volume pgdata
    # is postgres-owned; a bind mount or a root-owned volume would need CHOWN. DAC_OVERRIDE and FOWNER are needed at
    # restart by the entrypoint's chmod and find on the data directory.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    stop_signal: SIGINT
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    deploy:
      resources:
        limits:
          memory: 384M
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_MIGRATE_DB_PASSWORD: ${AUTH_MIGRATE_DB_PASSWORD}
      CALENDAR_DB_PASSWORD: ${CALENDAR_DB_PASSWORD}
      CALENDAR_MIGRATE_DB_PASSWORD: ${CALENDAR_MIGRATE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

volumes:
  pgdata:
  certs:
  acme-webroot:

networks:
  public:
  edge-gateway:
    internal: true
  gateway-frontend:
    internal: true
  services:
    internal: true
  data:
    internal: true
  auth-egress:
  certbot-egress:

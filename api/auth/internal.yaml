openapi: 3.0.3
info:
  title: OpenLobby - auth (INTERNAL endpoints)
  version: 0.1.0
  description: |
    **INTERNAL CONTRACT. Must never be exposed publicly.**

    These endpoints are only called by other services on the internal network: `gateway` (session validation) and `calendar` (name lookup).
    `gateway` blocks all `/internal/*` paths from clients (ADR 0002). No session cookies are used here.

    Applies to all endpoints:
    - **Correlation ID:** the caller passes its ID on. A missing or invalid value is replaced by a new one (see the parameter).
    - **Error format:** `{"error": {"code": "...", "requestId": "..."}}` (ADR 0001).
    - **Request body:** at most 16 KiB. A larger body, invalid JSON or a value of the wrong JSON type gives `400 invalid_request`. A field that is not `required` may be omitted or `null` and then has the default stated on the field. Unknown fields are ignored.
    - **Logging:** the token in `POST /internal/sessions/validate` is a secret. It must never be logged.
servers:
  - url: /
tags:
  - name: Sessions (internal)
    description: Called by gateway. Not public (ADR 0003).
  - name: Users (internal)
    description: Called by calendar. Not public (ADR 0003).
paths:
  /internal/sessions/validate:
    post:
      operationId: validateSession
      tags: [Sessions (internal)]
      summary: Validate session (INTERNAL, called by gateway)
      description: |
        Takes the session's token (the cookie value) and returns the user's ID and system admin role.
        The role is decided on every call from the configuration in `auth` (ADR 0011). It is not stored in the session.
        An expired, revoked or unknown token gives 401. The response is the same for all these cases.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateSessionRequest'
      responses:
        '200':
          description: Valid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionValidation'
        '400':
          description: Invalid JSON or a wrong JSON type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid, expired or revoked session. The gateway responds 401 without passing the request on to a domain service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/users/lookup:
    post:
      operationId: lookupUsers
      tags: [Users (internal)]
      summary: Look up display names for users (INTERNAL, called by calendar)
      description: |
        Returns display names for the given user IDs. Used by `calendar` for member lists and players.
        Unknown IDs are omitted from the response. Duplicate IDs are ignored. A missing, `null` or empty `userIds` gives `users: []`.
        Calendar never stores a copy of the names (ADR 0003).
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupUsersRequest'
      responses:
        '200':
          description: Display names for the IDs that exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNameList'
        '400':
          description: "`invalid_request`: invalid JSON, a wrong JSON type, a value that is not a uuid, or more than 100 IDs."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation ID (ADR 0001). A valid value is kept and passed on. A missing or invalid value is replaced by a new one. The response always contains `X-Request-Id`.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9-]+$'

  responses:
    ServiceUnavailable:
      description: A dependency does not respond. The request was refused before any change was committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected error. No details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, requestId]
      properties:
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - unauthenticated
            - invalid_request
            - service_unavailable
            - internal_error
        requestId:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9-]+$'
          description: Same value as `X-Request-Id` in the response. Used to match logs.

    ValidateSessionRequest:
      type: object
      properties:
        token:
          type: string
          description: A secret, never logged. Missing or empty gives 401 without a lookup (ADR 0003). Any value that matches no session also gives 401.

    SessionValidation:
      type: object
      required: [userId, isSystemAdmin]
      properties:
        userId:
          type: string
          format: uuid
          description: The user's internal ID. The gateway sets it as `X-User-Id`.
        isSystemAdmin:
          type: boolean
          description: True if the user is in `SYSTEM_ADMINS`. The gateway sets it as `X-User-System-Admin` (ADR 0011).

    LookupUsersRequest:
      type: object
      properties:
        userIds:
          type: array
          maxItems: 100
          description: User IDs to look up. At most 100. Duplicates are ignored. Omitted, `null` or an empty list gives an empty result.
          items:
            type: string
            format: uuid

    UserNameList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserName'

    UserName:
      type: object
      required: [userId, displayName]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          description: Display name read at the latest login.

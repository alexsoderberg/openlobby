openapi: 3.0.3
info:
  title: OpenLobby - calendar
  version: 0.1.0
  description: |
    Groups, memberships, invite links, lobbies, players and the game list.
    Clients reach the API via `gateway` (ADR 0002). Authorization is checked in `calendar`.

    Applies to all endpoints:
    - **Session:** all endpoints require the session cookie `ol_session`. No valid session, or the user identity from the gateway is missing or invalid, gives 401.
    - **Identity:** the gateway validates the session and sets `X-User-Id` and `X-User-System-Admin` on the call to `calendar`. Clients never send these headers, and the gateway removes them from client calls (ADR 0002, 0011).
    - **Membership:** a non-member gets `404 group_not_found`, never 403, so that the existence of a group is not revealed (ADR 0004 rule 2).
    - **System admin:** the role gives no right inside a group. It only gives the right to write `/api/games` (ADR 0011).
    - **Correlation ID:** `X-Request-Id` may be sent (at most 64 characters, `[A-Za-z0-9-]`). The response always contains `X-Request-Id`.
    - **Error format:** `{"error": {"code": "...", "requestId": "..."}}` (ADR 0001). The response contains no free text.
    - **Order of checks:** 1) identity (401 `unauthenticated`), 2) shape (400 `invalid_request`; an invalid uuid in a path gives the not-found code of that resource), 3) membership (404 `group_not_found`), 4) permission that does not depend on a resource (403 `not_allowed`), 5) validation of values (400 with a domain code), 6) existence (404), 7) permission on the resource (403), 8) state (409). A check that does not apply to an endpoint is skipped. ADR 0001.
    - **Request body:** at most 16 KiB. A body over 16 KiB gives `400 invalid_request`. A body over 1 MiB is refused by `edge` with 413 before it reaches the service (ADR 0009). Invalid JSON, a value of the wrong JSON type, and a missing or non-RFC 3339 time all give `400 invalid_request`. A field that is not `required` may be omitted or `null` and then has the default stated on the field. Unknown fields are ignored.
    - **Times:** RFC 3339. Any offset is accepted; responses use UTC with Z.
    - **Names:** trimmed before validation and measured in characters (code points). A trimmed empty name is invalid (ADR 0004 rule 1). The length limits in the schema apply after trim. The server responds with the domain code (e.g. `invalid_game`) also when the length is exceeded.
    - **Invite token:** a secret. Responses that contain a token get `Cache-Control: no-store`. The token is never logged.
servers:
  - url: /
tags:
  - name: Groups
    description: Groups, memberships and the group admin role (REQ-0002, 0006, 0008).
  - name: Invite links
    description: Invite links (REQ-0002, REQ-0007, ADR 0007).
  - name: Lobbies
    description: Lobbies with game and max players (REQ-0003, REQ-0004, REQ-0009).
  - name: Players
    description: Joining and leaving a lobby (REQ-0005).
  - name: Game list
    description: The game list. Maintained by the system admin. Members see it in their group's order (REQ-0009, REQ-0010, ADR 0010).
security:
  - sessionCookie: []
paths:
  /api/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: List my groups
      description: Groups where the caller is a member.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The groups where the caller is a member.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create group
      description: |
        Creates the group and makes the caller its admin. No invite link is created automatically (REQ-0002).
        The name must be 1–50 characters after trim. Otherwise `invalid_group_name`.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: The group is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSummary'
        '400':
          description: |
            `invalid_group_name`: the name is omitted, `null`, empty after trim, or longer than 50 characters.
            `invalid_request`: invalid JSON or a name of the wrong JSON type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}:
    get:
      operationId: getGroup
      tags: [Groups]
      summary: Get group with members
      description: Members only. The member list shows the role (`admin` or `member`) for all members.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: The group and its members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found`: the group does not exist or the caller is not a member."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/membership:
    delete:
      operationId: leaveGroup
      tags: [Groups]
      summary: Leave group
      description: |
        Removes the caller's membership, the caller's player entries on upcoming lobbies, and the caller's own invite links, in one transaction.
        Refused with `own_upcoming_lobbies_exist` if the caller has created upcoming lobbies. Then nothing changes.
        When the last admin leaves, the admin role passes to the member who has been in the group the longest.
        When the last member leaves, the group is removed with its lobbies and links (ADR 0004 rule 5, REQ-0006).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: The membership is removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found`: the group does not exist or the caller is not a member."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`own_upcoming_lobbies_exist`: the caller has created upcoming lobbies. Remove them first."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/admins/{userId}:
    put:
      operationId: makeGroupAdmin
      tags: [Groups]
      summary: Make member group admin
      description: |
        Makes a member an admin. Idempotent: a member who is already admin is not changed.
        No one can remove an admin role in MVP (REQ-0008).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: The member is an admin.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is not an admin in the group."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "`member_not_found` if `userId` has an invalid form (checked first). `group_not_found` if the caller is not a member. `member_not_found` if the user is not a member."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/invite-links:
    get:
      operationId: listInviteLinks
      tags: [Invite links]
      summary: List active invite links
      description: |
        A member sees their own active links. An admin sees all active links in the group, with the token so that they can be copied.
        Inactive links (expired, used up or revoked) are not shown (ADR 0007).
        The caller can revoke each link in the list.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: The active links the caller may see.
          headers:
            Cache-Control:
              description: Always `no-store`, since the response contains tokens.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InviteLink'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found`: the group does not exist or the caller is not a member."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createInviteLink
      tags: [Invite links]
      summary: Create invite link
      description: |
        Creates a new link with the caller as creator. The link is valid for 10 minutes from creation (`expiresAt`).
        `maxUses` is optional. Omitted or `null` gives 1. A wrong JSON type gives `invalid_request`, checked before membership (`group_not_found`). An integer outside 1–10 gives `invalid_max_uses`, checked after membership.
        Inactive links in the group are removed in the same transaction (ADR 0007).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteLinkRequest'
      responses:
        '201':
          description: The link is created. The response contains the token.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLink'
        '400':
          description: |
            `invalid_max_uses`: integer outside 1–10.
            `invalid_request`: invalid JSON or a wrong JSON type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found`: the group does not exist or the caller is not a member."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/invite-links/{linkId}:
    delete:
      operationId: revokeInviteLink
      tags: [Invite links]
      summary: Revoke invite link
      description: |
        May be done by the link's creator or by the group admin. Other members are refused.
        The link is removed. No new link is created. A link that is already inactive cannot be revoked (`invite_invalid`).
        Order: an invalid uuid in the path, from left to right (`groupId` gives `group_not_found`, `linkId` gives `invite_invalid`),
        membership (`group_not_found`), the link exists in this group (`invite_invalid`), the caller is creator or admin (`not_allowed`),
        the link is active (`invite_invalid`). The permission check comes before the link-state check (ADR 0007).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '204':
          description: The link is revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is neither the link's creator nor an admin in the group."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "`group_not_found` if the caller is not a member. `invite_invalid` if the link is missing or inactive."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/invites/{token}:
    get:
      operationId: getInvite
      tags: [Invite links]
      summary: Show group ID, name and membership for invite link
      description: |
        Returns the group's ID and name, and whether the caller is already a member, if the link is active. Active means not revoked, not expired and not used up. Every inactive case and an unknown or invalid token give the same 404, without group information.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The link is active.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`invite_invalid`: unknown, revoked, expired or used up, or an invalid token form."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/invites/{token}/join:
    post:
      operationId: joinInvite
      tags: [Invite links]
      summary: Join group via invite link
      description: |
        Creates the membership and increases `useCount` by 1 in the same transaction, after the group's lock.
        The validity is checked again after the lock. Two simultaneous calls on the last use give at most one membership.
        If the caller is already a member, the endpoint answers the same way, but nothing changes and the link is not counted.
        An inactive link gives `404 invite_invalid`, also for a caller who is already a member.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The caller is a member of the group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`invite_invalid`: the link is invalid. No membership is created."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/lobbies:
    get:
      operationId: listUpcomingLobbies
      tags: [Lobbies]
      summary: List the group's upcoming lobbies
      description: |
        Members only. Returns lobbies whose end time has not passed, sorted by start time and then by `id`.
        No paging and no interval filter in MVP (ADR 0004).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Upcoming lobbies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lobby'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found`: the group does not exist or the caller is not a member."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createLobby
      tags: [Lobbies]
      summary: Create lobby
      description: |
        Members only. The creator becomes the first player and takes a spot (`playerCount` 1). The lobby and the creator's player entry are saved in the same transaction.
        The response has no player names. The client fetches them with `GET /api/groups/{groupId}/lobbies/{lobbyId}`.
        Order: the request shape (`invalid_request`, also for a caller who is not a member), membership (`group_not_found`), then the rules below.
        Rules the server checks, in this order:
        - `startsAt` is in the future. Otherwise `lobby_in_past`.
        - `endsAt` is after `startsAt`. Otherwise `lobby_end_not_after_start`.
        - The lobby is shorter than 24 hours. Exactly 24 hours is rejected. Otherwise `lobby_too_long`.
        - Exactly one of `gameId` and `customGameName` is given. `gameId` must be the ID of a game in the game list. An unknown value, including a value that is not in uuid form, gives `invalid_game`. `customGameName` is 1–50 characters after trim. Otherwise `invalid_game`.
        - `modeId` needs `gameId`. A mode that is unknown, not a mode of the chosen game, or given with `customGameName`, gives `invalid_mode`.
        - `activityId` needs `modeId`. An activity that is unknown, not an activity of the chosen mode, or given without `modeId`, gives `invalid_activity`.
        - Game roles. The owner of the roles is the mode if given, otherwise the game if it has no modes, otherwise there are none. `roleSlots` omitted means the owner's own slots. Each `gameRoleId` must be a role of the owner, with no duplicates, otherwise `invalid_game_role`; `roleSlots` for an owner without roles also gives `invalid_game_role`. Roles not listed count 0. Each `slots` is an integer from 0 to 2147483647 and the sum must be from 1 to 2147483647, otherwise `invalid_capacity`. Roles with 0 slots are not stored. With roles, `maxPlayers` must be omitted or `null` (the sum is used), otherwise `invalid_capacity`.
        - A mode without roles needs `maxPlayers` from 1 to 2147483647, otherwise `invalid_capacity`.
        - Otherwise `maxPlayers` is omitted, `null` (both mean unlimited) or an integer from 1 to 2147483647. Otherwise `invalid_capacity`.
        - The creator's seat: for a lobby with game roles exactly one of `gameRoleId` (a role of the lobby) and `flex: true`; for a lobby without roles neither. `flex: false` counts as not given. Otherwise `invalid_game_role`.
        A clock time for the end that is before the start time (past midnight) is interpreted in the frontend, not here. The server only sees the instants.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLobbyRequest'
      responses:
        '201':
          description: The lobby is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lobby'
        '400':
          description: |
            `invalid_request` (invalid JSON, a wrong JSON type, or a time that is missing or not RFC 3339; checked before membership), or, after membership,
            `lobby_in_past`, `lobby_end_not_after_start`, `lobby_too_long`, `invalid_game`, `invalid_mode`, `invalid_activity`, `invalid_game_role`, `invalid_capacity`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found`: the group does not exist or the caller is not a member."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/lobbies/{lobbyId}:
    get:
      operationId: getLobby
      tags: [Lobbies]
      summary: Get lobby with players
      description: Members only. Shows the names of all players.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LobbyId'
      responses:
        '200':
          description: The lobby and its players.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found` if the caller is not a member. `lobby_not_found` if the lobby is missing or its end time has passed."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteLobby
      tags: [Lobbies]
      summary: Delete lobby
      description: |
        Only the lobby's creator may delete it. The players on the lobby are removed with it.
        Order: an invalid uuid in the path, from left to right (`groupId` gives `group_not_found`, `lobbyId` gives `lobby_not_found`),
        membership (`group_not_found`), the lobby exists in this group (`lobby_not_found`), the caller is the creator (`not_allowed`).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LobbyId'
      responses:
        '204':
          description: The lobby is deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is not the lobby's creator."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "`group_not_found` if the caller is not a member. `lobby_not_found` if the lobby is missing."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/lobbies/{lobbyId}/mode:
    put:
      operationId: setLobbyMode
      tags: [Lobbies]
      summary: Change the mode of a lobby
      description: |
        Only a player of the lobby may change it. Runs in one transaction under the group's lock, and every value and state below is read after the lock.
        Order: the form of the path and the body (`invalid_request`; an invalid uuid in the path gives its not-found code, from left to right), membership (`group_not_found`),
        the lobby exists in this group (`lobby_not_found`), its end time has not passed (`lobby_has_ended`), the caller is a player (`not_allowed`),
        the mode (`invalid_mode`: unknown, a mode of another game, or a lobby with no game), then the state: `currentModeId` is the lobby's current mode (`lobby_changed`),
        and the new limit (the sum of the mode's role slots, or its max players) is not below the number of players (`lobby_has_more_players`).
        If `modeId` is the lobby's current mode nothing changes and the answer is 200.
        Otherwise the mode, its name and the max players are set from the mode, the activity is cleared, and the lobby's role slots are replaced by the mode's game roles.
        Every player becomes flex. The number of players does not change.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LobbyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLobbyModeRequest'
      responses:
        '200':
          description: The lobby as saved, without player names. The players are loaded with `GET /api/groups/{groupId}/lobbies/{lobbyId}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lobby'
        '400':
          description: "`invalid_request` (invalid JSON, a wrong JSON type or a missing `modeId` or `currentModeId`; checked before membership) or, after the lobby checks, `invalid_mode`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is not a player of the lobby."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "`group_not_found` if the caller is not a member. `lobby_not_found` if the lobby is missing."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`lobby_has_ended`, `lobby_changed` (`currentModeId` is not the lobby's current mode) or `lobby_has_more_players` (the new limit is below the number of players)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/lobbies/{lobbyId}/activity:
    put:
      operationId: setLobbyActivity
      tags: [Lobbies]
      summary: Set the named activity of a lobby
      description: |
        Only a player of the lobby may change it. Runs in one transaction under the group's lock, and every value is read after the lock.
        Order: the form of the path and the body (`invalid_request`; an invalid uuid in the path gives its not-found code, from left to right), membership (`group_not_found`),
        the lobby exists in this group (`lobby_not_found`), its end time has not passed (`lobby_has_ended`), the caller is a player (`not_allowed`),
        the activity (`invalid_activity`: unknown, not an activity of the lobby's mode, or a lobby with no mode).
        The players and the limit do not change.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LobbyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLobbyActivityRequest'
      responses:
        '200':
          description: The lobby as saved, without player names. The players are loaded with `GET /api/groups/{groupId}/lobbies/{lobbyId}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lobby'
        '400':
          description: "`invalid_request` (invalid JSON, a wrong JSON type or a missing `activityId`; checked before membership) or, after the lobby checks, `invalid_activity`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is not a player of the lobby."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "`group_not_found` if the caller is not a member. `lobby_not_found` if the lobby is missing."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`lobby_has_ended`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: clearLobbyActivity
      tags: [Lobbies]
      summary: Clear the named activity of a lobby
      description: |
        Only a player of the lobby may change it. Keeps the mode. Idempotent: a lobby without an activity answers 200 as well.
        Order: an invalid uuid in the path, from left to right (`groupId` gives `group_not_found`, `lobbyId` gives `lobby_not_found`), membership (`group_not_found`),
        the lobby exists in this group (`lobby_not_found`), its end time has not passed (`lobby_has_ended`), the caller is a player (`not_allowed`).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LobbyId'
      responses:
        '200':
          description: The lobby as saved, without player names. The players are loaded with `GET /api/groups/{groupId}/lobbies/{lobbyId}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lobby'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is not a player of the lobby."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "`group_not_found` if the caller is not a member. `lobby_not_found` if the lobby is missing."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`lobby_has_ended`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/lobbies/{lobbyId}/players/me:
    put:
      operationId: joinLobby
      tags: [Players]
      summary: Join lobby
      description: |
        Members only. Checks after the group's lock, in this order: (1) the lobby is missing → `lobby_not_found`; (2) its end time has passed → `lobby_has_ended`, also for a caller who is already a player; (3) the seat does not fit the lobby → `invalid_game_role`; (4) the caller is already a player with the same seat → 204, nothing changes, even when the lobby is full; (5) a caller who is not yet a player: all spots are taken → `lobby_full`, then a chosen game role without a free slot → `game_role_full` (flex only needs a free spot); (6) a caller who is a player with another seat: a chosen game role without a free slot, not counting the caller → `game_role_full`; moving to flex is always allowed and `lobby_full` is not checked. Otherwise the caller is added or moves to the new seat. Joining works while the lobby is ongoing, as long as its end time has not passed (REQ-0005).
        The body is optional. The seat is `gameRoleId` or `flex: true`: a lobby with game roles needs exactly one of them, a lobby without roles needs neither. A call without a body works for a lobby without roles.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LobbyId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinLobbyRequest'
      responses:
        '204':
          description: The caller is a player in the lobby with the chosen seat.
        '400':
          description: "`invalid_request` (invalid JSON or a wrong JSON type; checked before membership) or, after membership, `invalid_game_role` (the seat does not fit the lobby, or `gameRoleId` is not a game role of it)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found` if the caller is not a member. `lobby_not_found` if the lobby is missing (e.g. deleted by its creator)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`lobby_has_ended` (also for a caller who is already a player; the client shows the lobby as ended), `lobby_full` or `game_role_full`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: leaveLobby
      tags: [Players]
      summary: Leave lobby
      description: |
        Members only. Always allowed, also after the end time and also if the caller was not a player (idempotent).
        The response is 404 `lobby_not_found` only when the lobby is missing (ADR 0004 rule 7).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LobbyId'
      responses:
        '204':
          description: The caller has left the lobby.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found` if the caller is not a member. `lobby_not_found` if the lobby is missing."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/groups/{groupId}/games:
    get:
      operationId: listGroupGames
      tags: [Game list]
      summary: List the game list in the group's order
      description: |
        Members only. Games are ordered by use in this group: the game with the most lobbies in the group comes first.
        A lobby counts if it was created from the game list, whether past or upcoming, as long as it still exists. Lobbies with a custom name do not count.
        Order: lobby count descending, then name ascending (ignoring case; unused games are ties with count 0), then `id` ascending. "Other" is not included; the client shows it last.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: The game list in the group's order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: "`group_not_found`: the group does not exist or the caller is not a member."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/games:
    get:
      operationId: listGames
      tags: [Game list]
      summary: List the game list (system admin)
      description: |
        System admin only (REQ-0010). The game list sorted by name (ignoring case, then `id`), for the system admin page. Members use `GET /api/groups/{groupId}/games`.
        "Other" is not in the list; it is a choice in the client.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The game list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is not a system admin."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createGame
      tags: [Game list]
      summary: Add game (system admin)
      description: |
        System admin only. The server generates the game's ID (uuid). The change takes effect immediately, without a new version.
        Rules in this order: invalid JSON or wrong JSON type (400 `invalid_request`), permission (403 `not_allowed`, before any domain validation),
        name (400 `invalid_game`, including `Other`), default max (400 `invalid_capacity`), genre (400 `invalid_genre`), then the game roles and modes (400 `invalid_game_role`, `invalid_capacity`, `invalid_mode`, `invalid_activity`),
        then the conflicts (409 `game_taken`, `mode_taken`, `game_role_taken`, `activity_taken`). Names are unique ignoring case: games in the list, modes in a game, game roles of one owner (the game or the mode), activities in a mode. ADR 0017.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: The game is added. The response contains the generated ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: |
            `invalid_game` (the name is omitted, `null`, empty after trim, longer than 50 characters, or `Other`),
            `invalid_capacity` (default max is not `null` or an integer from 1 to 2147483647, or a slot, a sum or a mode max is out of range), `invalid_genre` (genre is not in the list),
            `invalid_game_role`, `invalid_mode`, `invalid_activity` (the name is empty after trim or too long), or `invalid_request` (invalid JSON or a wrong JSON type, or an `id` that is repeated or not of the same owner).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is not a system admin."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`game_taken`, `mode_taken`, `game_role_taken` or `activity_taken`: the name is already used, ignoring case."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/games/{gameId}:
    put:
      operationId: replaceGame
      tags: [Game list]
      summary: Replace game (system admin)
      description: |
        System admin only. Replaces the name, the default max and the genre. The `gameId` in the path cannot be changed.
        Replaces the whole game: an omitted or `null` `defaultMaxPlayers` makes the game unlimited, an omitted or `null` `genre` gives the game no genre, and an omitted `name` gives `invalid_game`. Lobbies that were already created are not changed.
        An omitted or `null` `gameRoles` or `modes` leaves the stored entries unchanged, so a client that does not know them cannot remove them. An empty array removes all entries. An array with entries replaces them: an entry with an `id` keeps its identity, an entry without gets a new one, and the order is kept. A game without modes and with game roles has the sum of the slots as its default max (a given `defaultMaxPlayers` must be omitted, `null` or equal to the sum, otherwise `invalid_capacity`). ADR 0017.
        Rules in this order: a `gameId` in invalid form (404 `game_not_found`), invalid JSON or wrong JSON type (400 `invalid_request`), permission (403 `not_allowed`),
        name (400 `invalid_game`, including `Other`), default max (400 `invalid_capacity`) and genre (400 `invalid_genre`), the game roles and modes (400 `invalid_game_role`, `invalid_capacity`, `invalid_mode`, `invalid_activity`), unknown `gameId` (404 `game_not_found`), an `id` that is repeated or not of the same owner (400 `invalid_request`),
        name used by another game, mode, game role or activity (409 `game_taken`, `mode_taken`, `game_role_taken`, `activity_taken`).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GameIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceGameRequest'
      responses:
        '200':
          description: The game is updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: |
            `invalid_game` (name omitted, `null`, empty after trim, too long, or `Other`), `invalid_capacity` (default max, a slot, a sum or a mode max), `invalid_genre` (genre is not in the list),
            `invalid_game_role`, `invalid_mode`, `invalid_activity` (the name is empty after trim or too long),
            or `invalid_request` (invalid JSON or a wrong JSON type, or an `id` that is repeated or not of the same owner).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is not a system admin."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "`game_not_found`: the game does not exist, or the ID in the path has an invalid form."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`game_taken`, `mode_taken`, `game_role_taken` or `activity_taken`: the name is already used, ignoring case."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteGame
      tags: [Game list]
      summary: Delete game (system admin)
      description: |
        System admin only. Removes the game from the game list. Lobbies that use the game keep their game name and their max players.
        The client asks for confirmation before the call.
        Rules in this order: a `gameId` in invalid form (404 `game_not_found`), permission (403 `not_allowed`), unknown `gameId` (404 `game_not_found`).
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/GameIdPath'
      responses:
        '204':
          description: The game is deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: "`not_allowed`: the caller is not a system admin."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "`game_not_found`: the game does not exist, or the ID in the path has an invalid form."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ol_session
      description: |
        Session cookie set by `auth` at login (`ol_session`, `HttpOnly`, `Secure`, `SameSite=Lax`).
        The gateway validates the cookie and passes the identity on to `calendar`. The client never calls `calendar` directly, only through the gateway.

  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation ID (ADR 0001). A valid value is kept and passed on. A missing or invalid value is replaced by a new one. The response always contains `X-Request-Id`.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9-]+$'
    GroupId:
      name: groupId
      in: path
      required: true
      description: The group's ID. An unknown ID or an invalid format gives `group_not_found`.
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      description: The user's internal ID (uuid). An invalid format gives `member_not_found`. A user who is not a member of this group, including a member of another group, also gives `member_not_found`.
      schema:
        type: string
    LinkId:
      name: linkId
      in: path
      required: true
      description: The invite link's ID. Used in the path instead of the token, so that the token does not end up in logs (ADR 0007). An invalid format gives `invite_invalid`. A link that belongs to another group gives the same `invite_invalid` as a missing link (ADR 0004 rule 12).
      schema:
        type: string
    LobbyId:
      name: lobbyId
      in: path
      required: true
      description: The lobby's ID. An invalid format gives `lobby_not_found`. A lobby that belongs to another group gives the same `lobby_not_found` as a missing lobby (ADR 0004 rule 12).
      schema:
        type: string
    InviteToken:
      name: token
      in: path
      required: true
      description: The invite's token (43 characters base64url). A secret, never logged. An invalid form gives `invite_invalid`.
      schema:
        type: string
    GameIdPath:
      name: gameId
      in: path
      required: true
      description: The game's ID (uuid). An invalid form gives `game_not_found`.
      schema:
        type: string

  responses:
    Unauthenticated:
      description: No valid session, or the user identity from the gateway is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthenticated
              requestId: 5f0c2e1a-9b7d-4c1e-8a3f-1d2e3f4a5b6c
    ServiceUnavailable:
      description: A dependency does not respond. The request was refused before any change was committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected error. No details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, requestId]
      properties:
        code:
          type: string
          description: Machine-readable error code. The text for the user belongs to the frontend. not_found and method_not_allowed are returned by the gateway only.
          enum:
            - unauthenticated
            - service_unavailable
            - invalid_request
            - not_allowed
            - group_not_found
            - member_not_found
            - own_upcoming_lobbies_exist
            - invalid_group_name
            - invite_invalid
            - invalid_max_uses
            - lobby_not_found
            - lobby_in_past
            - lobby_end_not_after_start
            - lobby_too_long
            - lobby_has_ended
            - lobby_full
            - invalid_game
            - invalid_capacity
            - invalid_genre
            - invalid_mode
            - invalid_activity
            - invalid_game_role
            - game_role_full
            - lobby_changed
            - lobby_has_more_players
            - game_taken
            - mode_taken
            - activity_taken
            - game_role_taken
            - game_not_found
            - internal_error
            - not_found
            - method_not_allowed
        requestId:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9-]+$'
          description: Same value as `X-Request-Id` in the response. Used to match logs.

    GroupName:
      type: string
      minLength: 1
      maxLength: 50
      description: Group name, 1–50 characters after trim.

    GroupSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/GroupName'

    Group:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/Member'

    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GroupName'
          description: Group name. Omitted or `null` gives `invalid_group_name`.

    UserRef:
      type: object
      required: [userId, displayName]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string

    Member:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [role]
          properties:
            role:
              type: string
              enum: [admin, member]

    InviteMaxUses:
      type: integer
      minimum: 1
      maximum: 10
      description: Max uses for a link. Set at creation and not changed.

    InviteLink:
      type: object
      required: [id, token, createdByUserId, expiresAt, useCount, maxUses]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: The invite's secret. Copied into an invitation. Must never be logged.
        createdByUserId:
          type: string
          format: uuid
          description: The creator's user ID. The frontend shows the name from the member list.
        expiresAt:
          type: string
          format: date-time
          description: Expiry time in UTC. The frontend shows it in the user's local time.
        useCount:
          type: integer
          minimum: 0
          description: Number of successful entries via the link.
        maxUses:
          $ref: '#/components/schemas/InviteMaxUses'

    CreateInviteLinkRequest:
      type: object
      properties:
        maxUses:
          type: integer
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InviteMaxUses'
          description: Max uses, 1–10. Omitted or `null` gives 1.

    InviteInfo:
      type: object
      required: [groupId, groupName, isMember]
      properties:
        groupId:
          type: string
          format: uuid
          description: The group's ID. The frontend opens the group's page with it when `isMember` is true.
        groupName:
          $ref: '#/components/schemas/GroupName'
        isMember:
          type: boolean
          description: True if the caller is already a member. Opening the link then changes nothing and is not counted as a use.

    MaxPlayers:
      type: integer
      minimum: 1
      maximum: 2147483647
      nullable: true
      description: Max players, an integer from 1 to 2147483647. `null` or omitted means unlimited. Set at creation and not changed.

    DefaultMaxPlayers:
      type: integer
      minimum: 1
      maximum: 2147483647
      nullable: true
      description: Default max players of a game in the game list, an integer from 1 to 2147483647. `null` or omitted means unlimited. Changed by the system admin. Lobbies keep the value they were created with.

    GameName:
      type: string
      minLength: 1
      maxLength: 50
      description: Game name, 1–50 characters after trim.

    Genre:
      type: string
      enum: [shooter, moba, racing, strategy, survival, party, rpg, sports]
      description: Genre of a game from a fixed list (REQ-0014, ADR 0016). `null` means no genre.

    Lobby:
      type: object
      required: [id, gameName, gameGenre, maxPlayers, startsAt, endsAt, createdByUserId, playerCount, joinedByMe]
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
          nullable: true
          x-omitempty: false
          description: ID of the lobby's game in the game list, a copy kept in the lobby. `null` for a custom name ("Other"). Not in `required` so that existing fixtures stay valid, but the server always sends it (ADR 0017).
        gameName:
          $ref: '#/components/schemas/GameName'
        gameGenre:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Genre'
          description: Genre of the lobby's game as it is in the game list now. `null` for a custom name ("Other"), a game without a genre, or a game that was removed. Not stored in the lobby, so a genre change shows at the next read.
        maxPlayers:
          $ref: '#/components/schemas/MaxPlayers'
        startsAt:
          type: string
          format: date-time
          description: Start time in UTC.
        endsAt:
          type: string
          format: date-time
          description: End time in UTC. May be after midnight. The frontend shows the end date when it differs from the start date.
        createdByUserId:
          type: string
          format: uuid
        playerCount:
          type: integer
          minimum: 0
          description: Number of players. Shown as "X/Y players" when `maxPlayers` is set, otherwise "X players".
        joinedByMe:
          type: boolean
          description: "`true` when the caller is a player of the lobby (ADR 0014). Always `true` in the response of create."
        modeId:
          type: string
          format: uuid
          nullable: true
          x-omitempty: false
          description: ID of the lobby's game mode. `null` for a lobby without a mode. Not in `required` so that existing fixtures stay valid, but the server always sends it (ADR 0017).
        modeName:
          type: string
          nullable: true
          x-omitempty: false
          description: Name of the mode as it was when the lobby got it (a copy). `null` when unset, like `modeId`.
        activityId:
          type: string
          format: uuid
          nullable: true
          x-omitempty: false
          description: ID of the lobby's named activity. `null` for a lobby without one. Not in `required` so that existing fixtures stay valid, but the server always sends it (ADR 0017).
        activityName:
          type: string
          nullable: true
          x-omitempty: false
          description: Name of the named activity as it was when the lobby got it (a copy). `null` when unset, like `activityId`.
        flexCount:
          type: integer
          minimum: 0
          description: Number of players without a game role (flex). 0 for a lobby without game roles. Not in `required` so that existing fixtures stay valid, but the server always sends it (ADR 0017).
        roleSlots:
          type: array
          items:
            $ref: '#/components/schemas/RoleSlot'
          description: The lobby's game roles in the order of the game, with slots and players. Empty for a lobby without game roles. Not in `required` so that existing fixtures stay valid, but the server always sends it (ADR 0017).

    RoleSlot:
      type: object
      required: [gameRoleId, name, slots, playerCount]
      properties:
        gameRoleId:
          type: string
          format: uuid
        name:
          type: string
          description: Game role name as it was when the lobby was created (a copy).
        slots:
          type: integer
          minimum: 1
        playerCount:
          type: integer
          minimum: 0
          description: Number of players in the role. Shown as "Tank 0/1".

    RoleSlotInput:
      type: object
      required: [gameRoleId, slots]
      properties:
        gameRoleId:
          type: string
          description: ID of a game role of the lobby's mode or game. An unknown or repeated value gives `invalid_game_role`.
        slots:
          type: integer
          description: An integer from 0 to 2147483647, otherwise `invalid_capacity`. 0 leaves the role out of the lobby.

    JoinLobbyRequest:
      type: object
      properties:
        gameRoleId:
          type: string
          nullable: true
          description: The game role to take, a role of the lobby. Any other value, also one that is not a uuid, gives `invalid_game_role`.
        flex:
          type: boolean
          nullable: true
          description: "`true` to take a spot without a game role. `false` counts as not given."

    LobbyPlayer:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          properties:
            gameRoleId:
              type: string
              format: uuid
              nullable: true
              x-omitempty: false
              description: The player's game role. `null` means flex. Not in `required` so that existing fixtures stay valid, but the server always sends it (ADR 0017).

    SetLobbyModeRequest:
      type: object
      required: [modeId, currentModeId]
      properties:
        modeId:
          type: string
          format: uuid
          description: The mode to set. It must be a mode of the lobby's game, otherwise `invalid_mode`.
        currentModeId:
          type: string
          format: uuid
          nullable: true
          description: The mode the caller saw, `null` for none. If the lobby's mode is another one, because another change was saved first, the answer is `lobby_changed`.

    SetLobbyActivityRequest:
      type: object
      required: [activityId]
      properties:
        activityId:
          type: string
          format: uuid
          description: The activity to set. It must be an activity of the lobby's mode, otherwise `invalid_activity`.

    LobbyDetail:
      allOf:
        - $ref: '#/components/schemas/Lobby'
        - type: object
          required: [players]
          properties:
            players:
              type: array
              items:
                $ref: '#/components/schemas/LobbyPlayer'

    CreateLobbyRequest:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
          description: Start time in UTC, RFC 3339.
        endsAt:
          type: string
          format: date-time
          description: End time in UTC, RFC 3339.
        gameId:
          type: string
          nullable: true
          description: ID of a game in the game list. Exactly one of `gameId` and `customGameName` must be given. An unknown value, including one that is not a uuid, gives `invalid_game`.
        modeId:
          type: string
          nullable: true
          description: ID of a mode of the chosen game. Needs `gameId`. An unknown value, a mode of another game, or a value with `customGameName` gives `invalid_mode`.
        activityId:
          type: string
          nullable: true
          description: ID of a named activity of the chosen mode. Needs `modeId`. Any other value gives `invalid_activity`.
        roleSlots:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/RoleSlotInput'
          description: Slots per game role of the mode or game. Omitted or `null` uses the owner's own slots. Roles not listed count 0.
        gameRoleId:
          type: string
          nullable: true
          description: The creator's game role, a role of the lobby. Any other value, also one that is not a uuid, gives `invalid_game_role`.
        flex:
          type: boolean
          nullable: true
          description: "`true` for the creator to take a spot without a game role. `false` counts as not given."
        customGameName:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GameName'
          description: Free-text name for "Other", 1–50 characters after trim. Not added to the game list.
        maxPlayers:
          $ref: '#/components/schemas/MaxPlayers'

    GameId:
      type: string
      format: uuid
      description: The game's ID. A uuid generated by the system when the game is created. Never changed.

    Game:
      type: object
      required: [id, name, defaultMaxPlayers, genre]
      properties:
        id:
          $ref: '#/components/schemas/GameId'
        name:
          $ref: '#/components/schemas/GameName'
        defaultMaxPlayers:
          $ref: '#/components/schemas/DefaultMaxPlayers'
        genre:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Genre'
          description: The game's genre, or `null` for no genre.
        gameRoles:
          type: array
          items:
            $ref: '#/components/schemas/GameRole'
          description: The game roles of the game itself, in the order entered. Not used while the game has modes. Not in `required` so that existing fixtures stay valid, but the server always sends it (ADR 0017).
        modes:
          type: array
          items:
            $ref: '#/components/schemas/GameMode'
          description: The modes of the game, in the order entered. Not in `required` so that existing fixtures stay valid, but the server always sends it (ADR 0017).

    CreateGameRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GameName'
          description: Game name. Omitted or `null` gives `invalid_game`. The name `Other` (ignoring case, after trim) is reserved for the client's free-text choice and gives `invalid_game` (ADR 0010).
        defaultMaxPlayers:
          $ref: '#/components/schemas/DefaultMaxPlayers'
        genre:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Genre'
          description: The game's genre. Omitted or `null` means no genre. A value outside the list gives `invalid_genre`.
        gameRoles:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/GameRoleInput'
          description: The game roles of the game itself. Omitted or `null` leaves the stored roles unchanged, an empty array removes them, otherwise they replace the stored roles. ADR 0017.
        modes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/GameModeInput'
          description: The modes of the game. Omitted or `null` leaves the stored modes unchanged, an empty array removes them, otherwise they replace the stored modes. ADR 0017.

    ReplaceGameRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GameName'
          description: Game name. Omitted or `null` gives `invalid_game`. The name `Other` (ignoring case, after trim) is reserved for the client's free-text choice and gives `invalid_game` (ADR 0010).
        defaultMaxPlayers:
          $ref: '#/components/schemas/DefaultMaxPlayers'
        genre:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Genre'
          description: The game's genre. Omitted or `null` means no genre. A value outside the list gives `invalid_genre`.
        gameRoles:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/GameRoleInput'
          description: The game roles of the game itself. Omitted or `null` leaves the stored roles unchanged, an empty array removes them, otherwise they replace the stored roles. ADR 0017.
        modes:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/GameModeInput'
          description: The modes of the game. Omitted or `null` leaves the stored modes unchanged, an empty array removes them, otherwise they replace the stored modes. ADR 0017.

    GameRole:
      type: object
      required: [id, name, slots]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: Game role name, 1–30 characters after trim. Unique ignoring case among the roles of the same owner (the game, or the mode).
        slots:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: How many players the role takes in a lobby.

    GameRoleInput:
      type: object
      required: [name, slots]
      properties:
        id:
          type: string
          format: uuid
          description: Keeps the identity of an existing role of the same owner. Omitted for a new role. An `id` of another owner, or a repeated `id`, gives `invalid_request`.
        name:
          type: string
          description: Game role name. Empty after trim or longer than 30 characters gives `invalid_game_role`.
        slots:
          type: integer
          description: An integer from 1 to 2147483647, otherwise `invalid_capacity`. The sum of the slots of one owner must also be within that range.

    Activity:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Activity name, 1–50 characters after trim. Unique ignoring case within the mode.

    ActivityInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Keeps the identity of an existing activity of the same mode. Omitted for a new one.
        name:
          type: string
          description: Activity name. Empty after trim or longer than 50 characters gives `invalid_activity`.

    GameMode:
      type: object
      required: [id, name, maxPlayers, gameRoles, activities]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Mode name, 1–50 characters after trim. Unique ignoring case within the game.
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Max players of the mode. For a mode with game roles it is the sum of their slots.
        gameRoles:
          type: array
          items:
            $ref: '#/components/schemas/GameRole'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'

    GameModeInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Keeps the identity of an existing mode of the same game. Omitted for a new mode.
        name:
          type: string
          description: Mode name. Empty after trim or longer than 50 characters gives `invalid_mode`.
        maxPlayers:
          type: integer
          nullable: true
          description: Required, 1 to 2147483647, for a mode without game roles. Must be omitted or `null` for a mode with game roles (the sum is used). Otherwise `invalid_capacity`.
        gameRoles:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/GameRoleInput'
          description: The roles of the mode. A mode entry replaces the stored mode, so an omitted list means no roles.
        activities:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ActivityInput'
          description: The activities of the mode. A mode entry replaces the stored mode, so an omitted list means no activities.

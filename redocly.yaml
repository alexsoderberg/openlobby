# Redocly lint for api/*.yaml. Run from the repository root.
extends:
  - recommended
rules:
  # The project is private and no license has been decided. Re-enable when the project is opened.
  info-license: off
apis:
  # startLogin and completeLogin always redirect and never answer with JSON (ADR 0005), so both rules warn on them.
  # logout has no 4xx response (success is 204; its 500 and 503 are JSON, ADR 0001), so operation-4xx-response
  # warns on it. Five warnings by design (ADR 0012, consolidated amendment).
  # The file is matched by the path given to `redocly lint` (see `lint:api` in package.json).
  auth-public:
    root: api/auth/openapi.yaml
    rules:
      operation-2xx-response: off
      operation-4xx-response: off
